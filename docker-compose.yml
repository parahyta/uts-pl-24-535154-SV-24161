
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - craftory-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: Craftory
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync

      LOG_CHANNEL: stdout
      LOG_LEVEL: info

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "80"

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        php artisan migrate --force &&
        exec frankenphp run --config /etc/caddy/Caddyfile --adapter caddyfile

    healthcheck:
      test:
        - CMD
        - php
        - -r
        - |
          $$context = stream_context_create([
              'http' => ['timeout' => 3, 'ignore_errors' => true]
          ]);
          $$body = @file_get_contents('http://127.0.0.1:80/health', false, $$context);
          $$status = $$http_response_header[0] ?? '';
          $$data = $$body !== false ? json_decode($$body, true) : null;
          exit(
              str_contains($$status, ' 200 ') &&
              is_array($$data) &&
              ($$data['status'] ?? null) === 'healthy'
              ? 0 : 1
          );

      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - craftory-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - craftory-network

volumes:
  postgres_data:

networks:
  craftory-network:
    driver: bridge
